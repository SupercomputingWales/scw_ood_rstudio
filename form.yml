---
title: "RStudio Server"
cluster: "TrinityX"

form:
  - rs_version
  - auto_queues
  - ha_cpus
  - ha_gpus
  - ha_mem
  - ha_reservation
  - auto_qos
  - auto_accounts
  - bc_num_hours
  - modules
  - slurm_extra_args
  - email
  - bc_email_on_started

attributes:
  rs_version:
    label: "Version of RStudio."
    help: "<small>Supported version of RStudio available."
    widget: select
    options:
      - [ "2026.04.0.526 (R 4.6.0)", "2026.04.0.526"]
      - [ "2025.09.1.401 (R 4.5.1)", "2025.09.1.401"]
      - [ "2024.04.0.735 (R 4.4.0)", "2024.04.0.735"]
    value: "2025.09.1.401 (R 4.5.1)"

  auto_queues:
    value: "dev"
    help: "<small>Partition to submit the job to. See partition descriptions and limits 
           at https://wiki.arcca.cf.ac.uk/index.php/Partitions_on_Falcon</small>"

  ha_cpus:
    label: "Number of Cores for the job"
    widget: "number_field"
    help: "<small>Number of CPU cores to allocate</small>"
    required: true
    min: 1
    value: "1"

  ha_gpus:
    label: "Number of GPUs for the job (optional)"
    widget: "number_field"
    help: "<small>Number of GPUs to allocate (don't forget to select a partition with GPUs)</small>"
    min: 1
    max: 2
    value: ""

  ha_mem:
    label: "Memory (in GB) for the job (optional)"
    widget: "number_field"
    help: "<small>Amount of memory to allocate</small>"
  
  slurm_extra_args:
    label: "Extra SLURM arguments"
    help: "Additional arguments to pass to the SLURM job script"

  ha_reservation:
    label: "Reservation (optional)"
    help: "<small>For special occassions a reservation may be given</small>" 
  
  auto_qos:
    label: "QOS (optional)"
    help: "<small>For special job limits a QOS may be given</small>"

  auto_accounts:
    label: "Project code"
 
  bc_num_hours:
    label: "Runtime (in hours)"

  email:
    label: "Email address"
    help: "<small>Address used to send start of job notification</small>"

  modules:
    label: "Additional modules (optional)"
    help: "<small>Space separated list of additional modules to load</small>"

